<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dot.</title>
<style>
:root{--red:#ff4328;--ink:#000;--paper:#f6f5ef;--line:#e2e0d4;--sub:#6b6b6b;--white:#fff;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 18px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
.brand{font-weight:800;font-style:italic;letter-spacing:.02em;font-size:18px;}
.brand span{color:var(--red);}
nav{display:flex;gap:4px;background:#161616;border-radius:10px;padding:4px;flex-wrap:wrap;}
nav button{background:none;border:0;color:#bbb;padding:8px 13px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;}
nav button.active{background:var(--red);color:#fff;}
.admin-box{display:flex;gap:6px;align-items:center;}
input.admin-pin{width:100px;padding:8px 10px;border-radius:9px;border:1.5px solid #2b2b2b;background:#101010;color:var(--red);
  font-family:Consolas,monospace;font-size:13px;letter-spacing:.15em;text-align:center;}
input.admin-pin:focus{outline:none;border-color:var(--red);}
button.pill{background:var(--red);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;}
.admin-pill{font-size:11px;background:var(--red);color:#fff;padding:6px 12px;border-radius:20px;font-weight:800;}
button.ghost{background:transparent;border:1px solid #444;color:#eee;border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer;}
main{flex:1 0 auto;max-width:920px;width:100%;margin:0 auto;padding:20px 16px 60px;}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;background:#fff;}
h1{font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px;}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin:0 0 10px;}
.muted{color:var(--sub);font-size:13px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px;}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);}
.stat b{display:block;font-size:20px;}
.stat span{font-size:10.5px;color:var(--sub);text-transform:uppercase;}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:6px;border-left:4px solid var(--line);}
.item.edu{background:var(--paper);border-left-color:var(--ink);}
.item.mot{background:rgba(255,67,40,.08);border-left-color:var(--red);}
.item.promo{background:var(--ink);color:#fff;border-left-color:var(--red);}
.item.promo input[type=text]{background:#222;color:#fff;border-color:#333;}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);flex-shrink:0;}
.item .title{flex:1 1 140px;font-size:13.5px;font-weight:600;}
.item input[type=text]{flex:1 1 140px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;}
.tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:20px;background:#eee;color:#555;font-weight:800;}
.item.promo .tag{background:var(--red);color:#fff;}
.acct-row{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
.acct-row .name{flex:1;font-weight:700;font-size:13px;}
.acct-row label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);}
input[type=checkbox]{accent-color:var(--red);}
input[type=date]{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px;}
.gate{max-width:320px;margin:60px auto;text-align:center;}
.gate-icon{font-size:34px;}
input.gate-input{width:100%;padding:14px 16px;margin-top:14px;border:2px solid var(--ink);border-radius:12px;
  font-size:18px;letter-spacing:.12em;font-family:Consolas,monospace;text-align:center;background:#101010;color:var(--red);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-head{font-size:10px;text-align:center;color:var(--sub);text-transform:uppercase;}
.cal-cell{border:1px solid var(--line);border-radius:8px;min-height:70px;padding:4px;background:var(--paper);}
.cal-cell .d{font-size:10.5px;font-weight:700;color:var(--sub);}
.cal-cell textarea{width:100%;border:0;background:transparent;resize:none;font-size:10.5px;height:44px;font-family:inherit;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
footer{flex-shrink:0;text-align:center;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--sub);}
footer a{color:var(--red);font-weight:800;text-decoration:none;}
.growth-table{width:100%;border-collapse:collapse;}
.growth-table th,.growth-table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12.5px;}
.growth-table th{color:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
.growth-table input[type=number]{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;}
.delta.up{color:#1a8a3a;font-weight:800;}
.delta.down{color:var(--red);font-weight:800;}
.seg{display:inline-flex;background:#161616;border-radius:9px;padding:4px;gap:4px;}
.seg button{background:none;border:0;color:#bbb;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
.seg button.active{background:var(--red);color:#fff;}
.table-wrap{overflow-x:auto;}
@media (max-width:480px){
  header{padding:10px 12px;gap:8px;}
  .brand{font-size:16px;}
  nav button{padding:7px 10px;font-size:11px;}
  input.admin-pin{width:82px;font-size:11.5px;padding:7px 8px;}
  button.pill{padding:7px 10px;font-size:11px;}
  main{padding:14px 10px 40px;}
  .card{padding:14px;border-radius:13px;}
  .grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
  .item{flex-wrap:wrap;}
  .item .title{flex:1 1 100%;order:1;}
  .item input[type=text]{flex:1 1 100%;order:3;}
  .item .tag{order:2;}
  .acct-row{flex-direction:column;align-items:flex-start;gap:8px;}
  .acct-row label{font-size:11.5px;}
  .cal-grid{gap:3px;}
  .cal-cell{min-height:54px;padding:3px;}
  .cal-cell textarea{height:32px;font-size:9px;}
  .cal-cell .d{font-size:9.5px;}
  .growth-table th,.growth-table td{padding:6px 4px;font-size:11.5px;}
  .growth-table input[type=number]{width:64px;}
}

.timer-big{font-family:Consolas,monospace;font-size:44px;font-weight:800;letter-spacing:.04em;line-height:1;}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bbb;margin-right:6px;}
.status-dot.on{background:#1a8a3a;box-shadow:0 0 0 4px rgba(26,138,58,.18);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
button.big{border:0;border-radius:11px;padding:12px 22px;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:var(--red);}
button.big.out{background:var(--ink);}
button.big:disabled{opacity:.3;cursor:not-allowed;}
.plat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.plat-head h2{margin:0;}
.acct-block{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.acct-block .name{font-weight:800;font-size:13.5px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;}
.acct-block .name small{color:var(--sub);font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);cursor:pointer;}
.chips label.car{border-color:var(--ink);}
.chips label.done{background:rgba(26,138,58,.09);border-color:#1a8a3a;}
.chips input{width:17px;height:17px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--sub);font-weight:700;}
.badge.ok{background:rgba(26,138,58,.1);border-color:#1a8a3a;color:#1a8a3a;}
.badge.car{border-style:dashed;}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:12px;}
.bar i{display:block;height:100%;background:var(--red);}
.log{font-size:12.5px;color:var(--sub);margin:4px 0 0;}
@media (max-width:480px){.timer-big{font-size:34px;}}

.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.hero-top .who{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
.hero-num{font-size:58px;font-weight:800;line-height:1;margin-top:16px;letter-spacing:-.02em;}
.hero-num small{font-size:24px;color:var(--sub);font-weight:700;margin-left:4px;}
.hero-sub{font-size:12px;color:var(--sub);margin-top:4px;text-transform:uppercase;letter-spacing:.05em;}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:16px;color:var(--sub);}
.hero-meta b{color:var(--ink);font-family:Consolas,monospace;}
.hero-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);}
.hero-foot b{color:var(--ink);}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:800;margin:18px 0 4px;}
.grp:first-child{margin-top:0;}
.arow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.arow:last-child{border-bottom:0;}
.arow .ah{flex:1;font-weight:700;font-size:14px;}
.arow .an{font-size:12px;color:var(--sub);width:34px;text-align:right;font-weight:700;}
.pips{display:flex;align-items:center;gap:6px;}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid #cfcdbf;display:inline-block;}
.pip.sq{border-radius:4px;}
.pip.on{background:var(--ink);border-color:var(--ink);}
.pip.miss{border-color:var(--red);}
.sep{width:1px;height:14px;background:var(--line);margin:0 4px;display:inline-block;}
.legend{font-size:11px;color:var(--sub);margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.legend .pip{width:10px;height:10px;border-width:1.5px;margin-right:4px;vertical-align:middle;}
.sheet-scroll{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;}
table.sheet{width:100%;border-collapse:collapse;font-size:12.5px;}
table.sheet th{position:sticky;top:0;background:var(--ink);color:#fff;text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;z-index:1;}
table.sheet td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.sheet tbody tr[data-d]{cursor:pointer;}
table.sheet tr.sel td{background:rgba(255,67,40,.1);font-weight:700;}
table.sheet tr.dim td{color:#aaa;}
table.sheet td.bad{color:var(--red);font-weight:800;}
table.sheet tfoot td{font-weight:800;background:var(--paper);position:sticky;bottom:0;}
table.sheet tr.grp-start td{border-top:2px solid var(--ink);}
.st{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;background:#eee;color:#666;text-transform:uppercase;}
.st.Posted{background:rgba(26,138,58,.12);color:#1a8a3a;}
.st.Missed{background:rgba(255,67,40,.12);color:var(--red);}
input.vin{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;}
small.due{display:block;font-size:10px;color:var(--sub);margin-top:2px;}
small.due.now{color:#c77700;font-weight:800;}
.sheet-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.cal-cell{cursor:pointer;overflow:hidden;}
.cal-cell.sel{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,67,40,.25);}
.cal-cell.today .d{color:var(--red);}
.cal-cell .d{display:flex;justify-content:space-between;}
.cal-cell .cb{font-size:8.5px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 5px;}
.cal-txt{font-size:10.5px;white-space:pre-wrap;word-break:break-word;max-height:44px;overflow:hidden;margin-top:3px;}
textarea.cal-ed{width:100%;min-height:130px;padding:12px;border:1.5px solid var(--ink);border-radius:12px;font-family:inherit;font-size:14px;resize:vertical;}
@media (max-width:480px){.hero-num{font-size:46px;}.pip{width:12px;height:12px;}.pips{gap:5px;}}

.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-left:8px;vertical-align:middle}
.sync.live{background:#1a8a3a}.sync.offline{background:var(--red)}
.ringwrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:14px}
.ringbox{position:relative;width:150px;height:150px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}.rt{stroke:var(--line)}.rf{stroke:var(--red);stroke-linecap:round}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt .hero-num{font-size:34px;margin:0}.ringtxt .hero-num small{font-size:15px}.ringtxt .hero-sub{font-size:9px;margin:2px 0 0}
.streak b{display:block;font-size:46px;line-height:1;color:var(--red)}
.streak span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:800}
.streak em{display:block;font-size:12px;color:var(--sub);font-style:normal;margin-top:4px}
.hm{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.hb .hl{flex:0 0 130px}
.hb .hbar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hb .hbar i{display:block;height:100%;background:var(--ink)}.hb .hbar i.best{background:var(--red)}.hb b{width:46px;text-align:right}
.stsel,.duein{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:var(--paper);color:var(--ink)}
.duein.late{border-color:var(--red);color:var(--red)}
@media (max-width:480px){.stsel,.duein{order:4;flex:1 1 40%}}
#reportOv{position:fixed;inset:0;z-index:50;background:#fff;color:#000;overflow:auto;padding:24px 16px;--ink:#000;--paper:#f6f5ef;--line:#e2e0d4;--sub:#6b6b6b}
#reportOv .card{background:#fff}.rep{max-width:760px;margin:0 auto}
@media print{.no-print{display:none!important}body>*:not(#reportOv){display:none!important}#reportOv{position:static;overflow:visible;padding:0}}
:root[data-theme=dark]{--ink:#f2f0e8;--paper:#0d0d0d;--line:#2a2a2a;--sub:#9a9a96}
:root[data-theme=dark] header{background:#000}
:root[data-theme=dark] .card{background:#171717}
:root[data-theme=dark] .item.promo{background:#222}
:root[data-theme=dark] table.sheet th,:root[data-theme=dark] button.big.out{background:#2a2a2a;color:#fff}
:root[data-theme=dark] .cal-cell .cb{background:#444}
:root[data-theme=dark] input[type=text],:root[data-theme=dark] input[type=date],:root[data-theme=dark] input[type=number],:root[data-theme=dark] textarea{background:#101010;color:var(--ink);border-color:var(--line)}
:root[data-theme=dark] button.ghost{color:var(--ink)!important;border-color:#444!important}

main.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}main.enter>*:nth-child(2){animation-delay:.06s}main.enter>*:nth-child(3){animation-delay:.12s}main.enter>*:nth-child(n+4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
body{letter-spacing:-.005em;font-variant-numeric:tabular-nums}
header{backdrop-filter:blur(12px);box-shadow:0 6px 24px -12px rgba(0,0,0,.5)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px -16px rgba(0,0,0,.14);transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 18px 38px -18px rgba(0,0,0,.28);border-color:rgba(255,67,40,.35)}
.stat,.fs{transition:transform .22s,border-color .22s,box-shadow .22s}
.stat:hover,.fs:hover{transform:translateY(-3px);border-color:var(--red);box-shadow:0 12px 24px -14px rgba(255,67,40,.6)}
nav button{transition:background .2s,color .2s}nav button:hover:not(.active){background:#262626;color:#fff}
button.pill,button.big,button.ghost{transition:transform .15s,box-shadow .2s,filter .2s}
button.pill:hover,button.big:hover{transform:translateY(-1px);box-shadow:0 10px 20px -10px var(--red);filter:brightness(1.07)}button.ghost:hover{transform:translateY(-1px)}
.item,.arow,table.sheet tbody tr,.chips label{transition:background .2s,transform .2s,border-color .2s}
.item:hover{transform:translateX(4px)}.arow:hover{background:rgba(255,67,40,.05)}table.sheet tbody tr:hover td{background:rgba(255,67,40,.05)}.chips label:hover{border-color:var(--red)}
.cal-cell{transition:transform .15s,box-shadow .15s}.cal-cell:hover{transform:scale(1.05);z-index:2;box-shadow:0 8px 18px -8px rgba(0,0,0,.35)}
.pip{transition:transform .15s}.pip:hover{transform:scale(1.4)}.hb .hbar i{transition:width .8s cubic-bezier(.2,.7,.2,1)}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fs{position:relative;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.fs span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:800}
.fs b{display:block;font-size:30px;margin:6px 0 2px;letter-spacing:-.02em}.fs b small{font-size:14px;color:var(--sub);font-weight:700}.fs .bar{height:6px;margin-top:8px}
.fs:not(:last-child)::after{content:'\203A';position:absolute;right:-11px;top:50%;transform:translateY(-50%);color:var(--red);font-weight:800;font-size:20px;z-index:1}
.cols{display:flex;align-items:flex-end;gap:4px;height:110px}.cols div{flex:1;background:var(--red);border-radius:4px 4px 0 0;min-height:2px;opacity:.8;transition:opacity .2s,transform .2s}.cols div:hover{opacity:1;transform:scaleY(1.04);transform-origin:bottom}
small.due.late{color:var(--red);font-weight:800}
@media (max-width:600px){.funnel{grid-template-columns:repeat(2,1fr)}.fs::after{display:none}}
@media print{.card{box-shadow:none;transform:none!important;animation:none}}

.vo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--red);border-radius:12px;margin-bottom:14px;font-size:12.5px}
.vo b{color:var(--red);text-transform:uppercase;letter-spacing:.06em}.vo span{flex:1;color:var(--sub)}.vo input{padding:7px 10px;border:1px solid var(--line);border-radius:8px}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.7}
footer{transition:opacity .2s}footer a{transition:opacity .2s}footer a:hover{opacity:.7;text-decoration:underline}

/* ===== v5: slim instagram-style header ===== */
:root{--pop:#fff}:root[data-theme=dark]{--pop:#171717}
body{padding-top:0}
header{position:sticky;top:0;z-index:30;display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:10px;
 height:calc(54px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));
 background:rgba(255,255,255,.84);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:none;-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
:root[data-theme=dark] header{background:rgba(10,10,10,.82)}
.brand{display:flex;align-items:center;flex:0 0 auto;font-size:22px;font-weight:800;font-style:italic;letter-spacing:-.03em;cursor:pointer;user-select:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.brand:hover{transform:rotate(-5deg) scale(1.07)}
.brand span{display:inline-block;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);-webkit-background-clip:text;background-clip:text;color:transparent;transition:transform .3s}
.brand:hover span{transform:translateY(-3px)}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
// ---------- config ----------
const POSTER_NAME = 'Zahra';
const CLIENT_NAME = 'Tehreem';
const PMAP=[['ig','Instagram'],['tt','TikTok'],['yt','YouTube'],['fb','Facebook']];
const DEFAULT_CFG={accounts:[
  {pid:'ig',platform:'Instagram',handle:'@tsk_diet',reels:3,carousels:3},
  {pid:'ig',platform:'Instagram',handle:'@tskdiet_stories',reels:0,carousels:3},
  {pid:'ig',platform:'Instagram',handle:'@tehreeem_khan_tsk',reels:2,carousels:0},
  {pid:'tt',platform:'TikTok',handle:'@tskdiet',reels:3,carousels:0},
  {pid:'yt',platform:'YouTube',handle:'@Tehreem Khan',reels:1,carousels:0}],masoodWeekly:14,daudDaily:1};
let PLATFORMS=[], ACCOUNTS=[], ALL_TASKS=[];
const TOPICS = [
  ...Array.from({length:14},(_,i)=>({id:'edu'+(i+1), title:'Educational Reel '+(i+1), cat:'edu', tag:'Educational'})),
  ...Array.from({length:5},(_,i)=>({id:'mot'+(i+1), title:'Motivational Reel '+(i+1), cat:'mot', tag:'Motivational'})),
  ...Array.from({length:2},(_,i)=>({id:'promo'+(i+1), title:'Promo / Ad Reel '+(i+1), cat:'promo', tag:'Promo / Ad'})),
];
const EDITORS = [
  {id:'editor1', name:'Masood', period:'week', topics:TOPICS.slice(0,14)},
  {id:'editor2', name:'Daud', period:'day', topics:TOPICS.slice(14)},
];

// ---------- state ----------
let data = { editor1:{}, editor2:{}, poster:{}, calendar:{}, meta:{note:''}, pipe:{editor1:{},editor2:{}}, cfg:null, analytics:{weekly:{}, monthly:{}} };
let adminMode = false;
let unlocked = {};
let activeTab = 'dashboard';
let analyticsRange = 'weekly';
let calMonth = new Date(); calMonth.setDate(1);
const todayKey = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

function load(){ try{ data = {...data, ...JSON.parse(localStorage.getItem('ct_data')||'{}')}; }catch(e){} }
function save(){ try{ localStorage.setItem('ct_data', JSON.stringify(data)); }catch(e){} clearTimeout(syncT); syncT=setTimeout(syncCloud,600); }
const USERS={
  ezzy:{name:'Ezzy',pass:'2920',role:'manager',home:'dashboard'},
  masood:{name:'Masood',pass:'3477',role:'editor1',home:'editor1'},
  zahra:{name:'Zahra',pass:'1803',role:'poster',home:'poster'},
  daud:{name:'Daud',pass:'0249',role:'editor2',home:'editor2'}};
const ROLE_LABEL={manager:'Manager',editor1:'Editor',editor2:'Editor',poster:'Poster'};
let me=null;
function loadSession(){ try{ const u=localStorage.getItem('dot_session'); me=(u&&USERS[u])?{id:u,...USERS[u]}:null; }catch(e){ me=null; } adminMode=!!me&&me.role==='manager'; }
function login(u,p){ const k=String(u||'').trim().toLowerCase(), x=USERS[k]; if(!x||x.pass!==String(p||'').trim()) return false; try{ localStorage.setItem('dot_session',k); }catch(e){} loadSession(); return true; }
function logout(){ try{ localStorage.removeItem('dot_session'); }catch(e){} loadSession(); activeTab='dashboard'; render(); }
function isUnlocked(id){ return adminMode || (!!me && me.role===id); }

// ---------- header (v5) ----------
const mkSvg=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
const TAB_ICON={
 dashboard:mkSvg('<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/>'),
 analytics:mkSvg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
 sheet:mkSvg('<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 10h18M9 10v10"/>'),
 calendar:mkSvg('<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
 manager:mkSvg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>')};
const ICON_SUN=mkSvg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
const ICON_MOON=mkSvg('<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>');
function tabsFor(){
  const eds=EDITORS.map(e=>({id:e.id,name:e.name,l:e.name[0]}));
  if(!me) return [{id:'dashboard',name:'Dashboard'}];
  return [{id:'dashboard',name:'Dashboard'},...(adminMode?[{id:'analytics',name:'Analytics'}]:[]),...eds,{id:'poster',name:POSTER_NAME,l:POSTER_NAME[0]},...((adminMode||me.role==='poster')?[{id:'sheet',name:'Sheet'}]:[]),{id:'calendar',name:'Calendar'},...(adminMode?[{id:'manager',name:'Manager'}]:[])];
}
function openLogin(){
  if(document.getElementById('lgOv')) return;
  const o=document.createElement('div'); o.id='lgOv'; o.className='lg-ov';
  o.innerHTML=`<div class="lg-card" role="dialog" aria-modal="true"><button class="lg-x" id="lgX" aria-label="Close">&times;</button>
    <div class="lg-logo">dot<span>.</span></div><p class="lg-sub">Log in to see and edit your page</p>
    <input id="lgU" class="lg-in" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input id="lgP" class="lg-in" type="password" placeholder="Password" autocomplete="current-password">
    <div class="lg-err" id="lgE"></div><button class="login-btn lg-go" id="lgGo">Log in</button>
    <button class="lg-guest" id="lgG">Continue as guest</button></div>`;
  document.body.appendChild(o); requestAnimationFrame(()=>o.classList.add('on'));
  const $=id=>document.getElementById(id), card=o.querySelector('.lg-card'), u=$('lgU'), p=$('lgP');
  const close=()=>{ o.classList.remove('on'); setTimeout(()=>o.remove(),260); }; u.focus();
  const go=()=>{ if(login(u.value,p.value)){ close(); activeTab=me.home; render(); }
    else{ $('lgE').textContent='Wrong username or password'; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); p.value=''; p.focus(); } };
  $('lgGo').onclick=go; $('lgX').onclick=close; $('lgG').onclick=close; o.onclick=e=>{ if(e.target===o) close(); };
  o.onkeydown=e=>{ if(e.key==='Enter') go(); if(e.key==='Escape') close(); };
}
document.addEventListener('click',e=>{ const m=document.getElementById('menu'); if(m&&!e.target.closest('.me')) m.classList.remove('open'); });
function renderNav0(){
  const tabs=tabsFor(), nav=document.getElementById('tabs'), sig=tabs.map(t=>t.id).join();
  if(nav.dataset.sig!==sig){ nav.dataset.sig=sig;
    nav.innerHTML=tabs.map(t=>`<button data-tab="${t.id}" title="${esc(t.name)}" aria-label="${esc(t.name)}"><span class="ic">${t.l?`<i>${esc(t.l)}</i>`:TAB_ICON[t.id]}</span><span class="lb">${esc(t.name)}</span></button>`).join('');
    nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ activeTab=b.dataset.tab; render(); }); }
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
  const act=nav.querySelector('button.active'); if(act) setTimeout(()=>nav.scrollTo({left:Math.max(0,act.offsetLeft-(nav.clientWidth-act.offsetWidth)/2),behavior:'smooth'}),30);
  document.querySelector('.brand').onclick=()=>{ activeTab='dashboard'; render(); };
  const box=document.getElementById('adminBox'), sig2=(me?me.id:'-')+'|'+theme;
  if(box.dataset.sig===sig2) return; box.dataset.sig=sig2;
  box.innerHTML=`<button class="ib" id="themeBtn" title="${theme==='dark'?'Light mode':'Dark mode'}" aria-label="Toggle theme">${theme==='dark'?ICON_SUN:ICON_MOON}</button>`+
    (me?`<div class="me"><button class="av" id="avBtn" aria-label="Account"><b>${esc(me.name[0])}</b></button><div class="menu" id="menu"><div class="mh"><b>${esc(me.name)}</b><span>${ROLE_LABEL[me.role]}</span></div><button class="mi" id="outBtn">Log out</button></div></div>`
       :`<button class="login-btn" id="loginBtn">Log in</button>`);
  document.getElementById('themeBtn').onclick=()=>{ theme=theme==='dark'?'light':'dark'; try{localStorage.setItem('ct_theme',theme)}catch(e){} applyTheme(); render(); };
  if(me){ document.getElementById('avBtn').onclick=()=>document.getElementById('menu').classList.toggle('open'); document.getElementById('outBtn').onclick=logout; }
  else document.getElementById('loginBtn').onclick=openLogin;
}

// ---------- editor view ----------
function editorProgress(ed){
  const st=data[ed.id]||{}; const topics=ed.topics; const done=topics.filter(t=>st[t.id]?.done).length;
  return {done, total:topics.length};
}
// ---------- work-session helpers (timer) ----------
const pad = n => String(n).padStart(2,'0');
function fmtDur(ms){ const t=Math.max(0,Math.floor(ms/1000)); return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function getDay(date){ const d = data.poster[date] = data.poster[date] || {}; d.tasks = d.tasks || {}; d.sessions = d.sessions || []; d.times = d.times || {}; d.views = d.views || {}; return d; }
function setPosted(day,key,val,date){ day.tasks[key]=val; if(val){ if(date===todayKey()) day.times[key]=day.times[key]||Date.now(); } else delete day.times[key]; }
const dnr=h=>String(h).replace(/^@/,'').replace(/_+/g,' ').trim().toUpperCase(), dn=h=>esc(dnr(h));
const esc = v => String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const dateKey = (y,m,d) => y+'-'+pad(m+1)+'-'+pad(d);
function dayOrEmpty(date){ return data.poster[date] ? getDay(date) : {tasks:{},sessions:[],times:{},views:{}}; }
function firstTracked(){ const ks=Object.keys(data.poster).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).filter(k=>{const d=data.poster[k]; return (d.sessions&&d.sessions.length)||Object.values(d.tasks||{}).some(Boolean);}).sort(); return ks[0]||null; }
function statusOf(date,key,ft){ const d=dayOrEmpty(date); if(d.tasks[key]) return 'Posted'; if(date<todayKey()) return (ft&&date>=ft)?'Missed':'—'; return 'Pending'; }
function dayStats(date,ft){ const d=dayOrEmpty(date); const total=ALL_TASKS.length; const posted=doneCount(d); const tracked=!!ft&&date>=ft&&date<=todayKey();
  const missed=(date<todayKey()&&tracked)?total-posted:0; let v24=0,v48=0; Object.values(d.views||{}).forEach(v=>{v24+=Number(v.h24)||0; v48+=Number(v.h48)||0;});
  return {posted,missed,total,v24,v48,tracked}; }
function monthTotals(y,m){ const ft=firstTracked(); const n=new Date(y,m+1,0).getDate(); const t={posted:0,missed:0,v24:0,v48:0}; for(let i=1;i<=n;i++){ const x=dayStats(dateKey(y,m,i),ft); t.posted+=x.posted; t.missed+=x.missed; t.v24+=x.v24; t.v48+=x.v48; } return t; }
function workedMs(day){ return (day.sessions||[]).reduce((a,x)=>a+((x.out||Date.now())-x.in),0); }
function isOn(day){ return (day.sessions||[]).some(x=>!x.out); }
function doneCount(day){ return ALL_TASKS.filter(t=>day.tasks && day.tasks[t.key]).length; }
let tickHandle=null;
function startTick(){
  clearInterval(tickHandle);
  const update=()=>{ const els=document.querySelectorAll('[data-timer]'); if(!els.length){ clearInterval(tickHandle); return; }
    els.forEach(el=>{ const day=data.poster[el.dataset.timer]; if(day) el.textContent=fmtDur(workedMs(day)); }); };
  update(); tickHandle=setInterval(update,1000);
}
function sessionLog(day){
  if(!(day.sessions||[]).length) return '<p class="log">No sign-ins yet.</p>';
  return '<p class="log">'+day.sessions.map(x=>`In ${fmtTime(x.in)} → ${x.out?('Out '+fmtTime(x.out)):'<b style="color:#1a8a3a">working now</b>'}`).join(' &nbsp;•&nbsp; ')+'</p>';
}

function attendanceHtml(){
  const keys=Object.keys(data.poster).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k) && (data.poster[k].sessions||[]).length).sort().reverse();
  const now=new Date(), tk=todayKey();
  const wk=new Date(now); wk.setDate(wk.getDate()-6); const wkKey=wk.getFullYear()+'-'+pad(wk.getMonth()+1)+'-'+pad(wk.getDate());
  const mk=tk.slice(0,7);
  const sum=f=>keys.filter(f).reduce((a,k)=>a+workedMs(data.poster[k]),0);
  const rows=keys.slice(0,31).map(k=>{ const d=data.poster[k];
    const lbl=new Date(k+'T00:00:00').toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'});
    const sess=d.sessions.map(x=>`${fmtTime(x.in)} → ${x.out?fmtTime(x.out):'<b style="color:#1a8a3a">now</b>'}`).join('<br>');
    return `<tr><td>${lbl}${k===tk?' <span class="tag">Today</span>':''}</td><td>${sess}</td><td><b data-timer="${k}">${fmtDur(workedMs(d))}</b></td></tr>`; }).join('');
  return `<div class="card"><h1>Login / Logout Schedule</h1>
    <div class="grid"><div class="stat"><b>${fmtDur(sum(k=>k>=wkKey))}</b><span>Last 7 days</span></div>
    <div class="stat"><b>${fmtDur(sum(k=>k.startsWith(mk)))}</b><span>This month</span></div></div>
    ${rows?`<div class="sheet-scroll" style="margin-top:12px"><table class="sheet"><thead><tr><th>Day</th><th>Login → Logout</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="muted">No logins yet. Press Sign in to start.</p>'}</div>`;
}

function sumRows(y,m){
  const ft=firstTracked(); const n=new Date(y,m+1,0).getDate();
  let html='';
  for(let i=1;i<=n;i++){
    const key=dateKey(y,m,i), x=dayStats(key,ft);
    const wd=new Date(y,m,i).toLocaleDateString([], {weekday:'short'});
    html += `<tr data-d="${key}" class="${key===sheetDate?'sel':''} ${x.tracked?'':'dim'}"><td>${wd} ${i}</td><td>${x.tracked?x.posted+'/'+x.total:'—'}</td><td class="${x.missed?'bad':''}">${x.tracked?x.missed:'—'}</td><td>${x.v24||'—'}</td><td>${x.v48||'—'}</td></tr>`;
  }
  return html;
}
function viewCell(key,f,val,base){
  const has = val!=='' && val!=null;
  let hint='';
  if(!has && base){ const due=base+(f==='h24'?24:48)*3600000;
    hint = Date.now()>=due ? '<small class="due now">due now</small>' : '<small class="due">due '+new Date(due).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'})+'</small>'; }
  return `<input type="number" min="0" class="vin" data-key="${key}" data-f="${f}" placeholder="0" value="${has?val:''}">${hint}`;
}
function downloadCsv(y,m){
  const ft=firstTracked(); const n=new Date(y,m+1,0).getDate();
  const rows=[['Date','Platform','Account','Post','Status','Views 24h','Views 48h']];
  for(let i=1;i<=n;i++){ const key=dateKey(y,m,i); if(!dayStats(key,ft).tracked) continue; const day=dayOrEmpty(key);
    ACCOUNTS.forEach(a=>a.tasks.forEach(t=>{ const v=day.views[t.key]||{};
      rows.push([key,a.platform,a.handle,t.label,statusOf(key,t.key,ft),v.h24==null?'':v.h24,v.h48==null?'':v.h48]); })); }
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='zahra-'+y+'-'+pad(m+1)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

const FIREBASE_CONFIG = { apiKey:'', authDomain:'', projectId:'', storageBucket:'', messagingSenderId:'', appId:'' };
let db=null, ready=false, got=0, pushed={}, pendingRender=false, syncT=null;
let theme=(()=>{try{return localStorage.getItem('ct_theme')||'light'}catch(e){return 'light'}})();
const SECTIONS=['editor1','editor2','calendar','analytics','meta','pipe','cfg'];
function applyTheme(){ document.documentElement.dataset.theme=theme; }
function setSync(s){ const e=document.getElementById('syncDot'); if(e){ e.className='sync '+s; e.title=s==='live'?'Synced':s==='offline'?'Offline - saved locally':'Local only (Firebase not configured)'; } }
function cloudInit(){
  if(!FIREBASE_CONFIG.apiKey || typeof firebase==='undefined') return setSync('local');
  try{ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); firebase.auth().signInAnonymously().catch(()=>{}).then(listen); }catch(e){ setSync('local'); }
}
function listen(){
  let f1=true,f2=true;
  const first=()=>{ if(++got===2){ ready=true; syncCloud(); } setSync('live'); };
  db.collection('dot').onSnapshot(snap=>{ let ch=false;
    snap.docChanges().forEach(c=>{ if(c.type==='removed'||c.doc.metadata.hasPendingWrites) return;
      const k=c.doc.id, v=(c.doc.data()||{}).v, s=JSON.stringify(v);
      if(SECTIONS.includes(k)&&v!==undefined&&pushed[k]!==s){ data[k]=v; pushed[k]=s; ch=true; } });
    if(f1){f1=false; first();} if(ch) softRender(); }, ()=>setSync('offline'));
  db.collection('days').onSnapshot(snap=>{ let ch=false;
    snap.docChanges().forEach(c=>{ if(c.type==='removed'||c.doc.metadata.hasPendingWrites) return;
      const k=c.doc.id, v=(c.doc.data()||{}).v, s=JSON.stringify(v);
      if(v!==undefined&&pushed['p_'+k]!==s){ data.poster[k]=v; pushed['p_'+k]=s; ch=true; } });
    if(f2){f2=false; first();} if(ch) softRender(); }, ()=>setSync('offline'));
}
function syncCloud(){
  if(!db||!ready) return;
  const put=(col,id,val,key)=>{ if(val==null) return; const s=JSON.stringify(val); if(pushed[key]===s) return; pushed[key]=s; db.collection(col).doc(id).set({v:JSON.parse(s)}).catch(()=>setSync('offline')); };
  SECTIONS.forEach(k=>put('dot',k,data[k],k));
  Object.keys(data.poster).forEach(d=>put('days',d,data.poster[d],'p_'+d));
}
function softRender(){ const a=document.activeElement; if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){ pendingRender=true; return; } render(); }
document.addEventListener('focusout',()=>{ if(pendingRender){ pendingRender=false; setTimeout(render,60); } });

// streak
function addDays(k,n){ const d=new Date(k+'T00:00:00'); d.setDate(d.getDate()+n); return dateKey(d.getFullYear(),d.getMonth(),d.getDate()); }
function streak(){
  const ft=firstTracked(), tot=ALL_TASKS.length; if(!ft) return {cur:0,best:0};
  const full=d=>doneCount(dayOrEmpty(d))>=tot; let best=0,run=0;
  for(let d=ft; d<=todayKey(); d=addDays(d,1)){ if(full(d)){ run++; best=Math.max(best,run); } else run=0; }
  let cur=0, d=todayKey(); if(!full(d)) d=addDays(d,-1); while(d>=ft&&full(d)){ cur++; d=addDays(d,-1); }
  return {cur,best};
}

  return `<div class="card banner"><div class="bn-em">📅</div><div><b>Day 29 - monthly report day</b><div class="muted">${miss?miss+' post'+(miss>1?'s are':' is')+' still missing views or followers gained. Fill them in so the full report is ready.':'Everything is filled in - the report is ready on the dashboard.'}</div><div class="btn-row" style="margin-top:10px"><button class="pill" id="remBtn">Open sheet</button></div></div></div>`; }
function monthReportCard(detail){ const c=cycleInfo(); if(!c||!c.isReportDay) return ''; const by={};
  for(let k=c.start;k<=c.end;k=addDays(k,1)){ const d=data.poster[k]; if(!d) continue; ACCOUNTS.forEach(a=>a.tasks.forEach(t=>{ if(!d.tasks[t.key]) return; const v=(d.views||{})[t.key]||{}, n=Number(v.h48)||Number(v.h24)||0, f=Number(v.fol)||0;
    const o=by[a.id]=by[a.id]||{a,posts:0,views:0,fol:0,rows:[]}; o.posts++; o.views+=n; o.fol+=f; o.rows.push({k,t,n,f}); })); }
  const L=Object.values(by); if(!L.length) return ''; const T=L.reduce((x,o)=>({p:x.p+o.posts,v:x.v+o.views,f:x.f+o.fol}),{p:0,v:0,f:0});
  return `<div class="card"><h2>29-day report · ${fmtD(c.start)} - ${fmtD(c.end)}</h2><div class="grid"><div class="stat"><b>${T.p}</b><span>Posts</span></div><div class="stat"><b>${fmtN(T.v)}</b><span>Views</span></div><div class="stat"><b>+${fmtN(T.f)}</b><span>Followers gained</span></div></div>`+
    L.map(o=>`<div class="grp">${dn(o.a.handle)} · ${o.a.platform}</div><div class="arow"><span class="ah">${o.posts} posts</span><span class="an" style="width:auto">${fmtN(o.views)} views · +${fmtN(o.fol)} followers</span></div>`+
      (detail?`<div class="sheet-scroll" style="max-height:240px"><table class="sheet"><thead><tr><th>Date</th><th>Post</th><th>Views</th><th>Followers</th></tr></thead><tbody>${o.rows.map(r=>`<tr><td>${fmtD(r.k)}</td><td>${r.t.label}</td><td>${r.n}</td><td>+${r.f}</td></tr>`).join('')}</tbody></table></div>`:'')).join('')+`</div>`; }

// ---------- v9: logos, tiles, ring rows ----------
const LOGO={
 ig:'<svg viewBox="0 0 24 24"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".4" stop-color="#fa7e1e"/><stop offset=".7" stop-color="#d62976"/><stop offset="1" stop-color="#962fbf"/></linearGradient></defs><rect width="24" height="24" rx="7" fill="url(#igg)"/><rect x="5.5" y="5.5" width="13" height="13" rx="4" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="12" cy="12" r="3.1" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="16.1" cy="7.9" r="1" fill="#fff"/></svg>',
 fb:'<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="12" fill="#1877f2"/><path d="M13.4 20v-6.4h2.2l.4-2.6h-2.6V9.4c0-.8.3-1.3 1.4-1.3H16V5.8c-.3 0-1.1-.1-2-.1-2 0-3.3 1.2-3.3 3.4V11H8.5v2.6h2.2V20z" fill="#fff"/></svg>',
 tt:'<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#111"/><path d="M13.2 5v8.6a2.2 2.2 0 1 1-2-2.2M13.2 5c.3 1.9 1.5 3 3.4 3.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
 yt:'<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#e00"/><path d="M10 8.6v6.8l5.8-3.4z" fill="#fff"/></svg>'};
const logo=pid=>`<span class="lg">${LOGO[pid]||''}</span>`;
const miniRing=(f,txt,sz=48)=>{ const C=131.95; return `<span class="mring" style="width:${sz}px;height:${sz}px"><svg viewBox="0 0 52 52"><circle class="rt" cx="26" cy="26" r="21" fill="none" stroke-width="5"/><circle class="rf" cx="26" cy="26" r="21" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,f))}" transform="rotate(-90 26 26)"/></svg><b>${txt}</b></span>`; };
function platformsCard(){
  const day=dayOrEmpty(dashDate), ft=firstTracked(), x=dayStats(dashDate,ft), past=dashDate<todayKey()&&x.tracked, R=postRecs(7,0), NM={ig:'Instagram',fb:'Facebook',tt:'TikTok',yt:'YouTube'};
  const tile=(a,mir)=>{ const n=a.tasks.filter(t=>day.tasks[t.key]).length, tt=a.tasks.length, v7=R.filter(r=>r.a.id===a.id).reduce((q,r)=>q+r.n,0);
    const pips=k=>a.tasks.filter(t=>t.kind===k).map(t=>`<span class="pip ${k==='carousel'?'sq':''} ${day.tasks[t.key]?'on':(past?'miss':'')}"></span>`).join('');
    const body=me?`<div class="pips">${pips('reel')}${pips('carousel')}</div>`:(mir?'':`<small class="due">${fmtN(v7)} views · 7 days</small>`);
    return `<div class="tile"><div class="tl">${logo(mir?'fb':a.pid)}<b>${dn(a.handle)}</b></div><div class="tr">${me?miniRing(tt?n/tt:0,n+'/'+tt):''}</div>${body?`<div class="tb">${body}</div>`:''}</div>`; };
  return ['ig','fb','tt','yt'].map(p=>{ const src=ACCOUNTS.filter(a=>a.pid===(p==='fb'?'ig':p)); if(!src.length) return '';
    const done=src.reduce((q,a)=>q+a.tasks.filter(t=>day.tasks[t.key]).length,0), tot=src.reduce((q,a)=>q+a.tasks.length,0);
    return `<div class="card plat ${p}"><div class="ph">${logo(p)}<b>${NM[p]}</b><span>${me?done+'/'+tot+' posted':''}</span></div><div class="tiles">${src.map(a=>tile(a,p==='fb')).join('')}</div></div>`; }).join('')+
    (me?'<div class="legend"><span><span class="pip on"></span>Posted</span><span><span class="pip"></span>Pending</span><span><span class="pip miss"></span>Missed</span><span><span class="pip sq"></span>Carousel</span></div>':'');
}
function acctTiles(R){ const m={}; ACCOUNTS.forEach(a=>m[a.id]={a,v:0}); R.forEach(r=>{ if(m[r.a.id]) m[r.a.id].v+=r.n; });
  const L=Object.values(m).sort((x,y)=>y.v-x.v), mx=Math.max(1,...L.map(o=>o.v));
  return '<div class="tiles" style="padding:0">'+L.map(o=>`<div class="tile"><div class="tl">${logo(o.a.pid)}<b>${dn(o.a.handle)}</b></div><div class="tr">${miniRing(o.v/mx,fmtN(o.v),54)}</div></div>`).join('')+'</div>'; }
function dutyHtml2(){ const tk=todayKey(), ws=weekStart(tk), d=dayOrEmpty(tk), chip=(l,c)=>`<span class="chip ${c}">${l}</span>`, items=[];
  ACCOUNTS.forEach(a=>a.tasks.forEach(t=>items.push({ok:!!d.tasks[t.key],l:dn(a.handle)+' · '+t.label})));
  const pend=items.filter(i=>!i.ok), done=items.filter(i=>i.ok), pc=f=>Math.round(f*100)+'%';
  const row=(n,sub,f,ch)=>`<div class="dr2"><div class="mr">${miniRing(f,pc(f),64)}</div><div class="dm"><div class="dh"><b>${n}</b><span>${sub}</span></div><div class="chips">${ch}</div></div></div>`;
  let prov=0,exp=0, out=row(POSTER_NAME,done.length+'/'+items.length+' posted today',items.length?done.length/items.length:0,
    pend.slice(0,8).map(i=>chip('○ '+i.l,'pend')).join('')+(pend.length>8?chip('+'+(pend.length-8)+' pending','pend'):'')+done.slice(0,8).map(i=>chip('✓ '+i.l,'ok')).join('')+(done.length>8?chip('+'+(done.length-8)+' done','ok'):''));
  EDITORS.forEach(e=>{ const k=e.period==='week'?ws:tk, q=quota(e,k), a=slotsOf(e,k).slice(0,q), rc=a.filter(s=>s.recv).length, dl=a.filter(s=>s.done).length; prov+=rc; exp+=q;
    out+=row(e.name,dl+'/'+q+' delivered '+(e.period==='week'?'this week':'today'),q?dl/q:0,chip('✓ '+dl+' delivered','ok')+chip('○ '+(rc-dl)+' editing','pend')+chip('… '+(q-rc)+' waiting for manager','wait')); });
  return out+row('Manager',exp-prov?(exp-prov)+' reels still to hand over':'All reels handed over 🎉',exp?prov/exp:0,chip('✓ '+prov+' handed over','ok')+(exp-prov?chip('… '+(exp-prov)+' to go','wait'):'')); }
