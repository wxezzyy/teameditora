<html lang="en">
<head>

<style>
:root{--red:#ff4328;--ink:#000;--paper:#f6f5ef;--line:#e2e0d4;--sub:#6b6b6b;--white:#fff;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 18px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
.brand{font-weight:800;font-style:italic;letter-spacing:.02em;font-size:18px;}
.brand span{color:var(--red);}
nav{display:flex;gap:4px;background:#161616;border-radius:10px;padding:4px;flex-wrap:wrap;}
nav button{background:none;border:0;color:#bbb;padding:8px 13px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;}
nav button.active{background:var(--red);color:#fff;}
.admin-box{display:flex;gap:6px;align-items:center;}
input.admin-pin{width:100px;padding:8px 10px;border-radius:9px;border:1.5px solid #2b2b2b;background:#101010;color:var(--red);
  font-family:Consolas,monospace;font-size:13px;letter-spacing:.15em;text-align:center;}
input.admin-pin:focus{outline:none;border-color:var(--red);}
button.pill{background:var(--red);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;}
.admin-pill{font-size:11px;background:var(--red);color:#fff;padding:6px 12px;border-radius:20px;font-weight:800;}
button.ghost{background:transparent;border:1px solid #444;color:#eee;border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer;}
main{flex:1 0 auto;max-width:920px;width:100%;margin:0 auto;padding:20px 16px 60px;}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;background:#fff;}
h1{font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px;}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin:0 0 10px;}
.muted{color:var(--sub);font-size:13px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px;}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);}
.stat b{display:block;font-size:20px;}
.stat span{font-size:10.5px;color:var(--sub);text-transform:uppercase;}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:6px;border-left:4px solid var(--line);}
.item.edu{background:var(--paper);border-left-color:var(--ink);}
.item.mot{background:rgba(255,67,40,.08);border-left-color:var(--red);}
.item.promo{background:var(--ink);color:#fff;border-left-color:var(--red);}
.item.promo input[type=text]{background:#222;color:#fff;border-color:#333;}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);flex-shrink:0;}
.item .title{flex:1 1 140px;font-size:13.5px;font-weight:600;}
.item input[type=text]{flex:1 1 140px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;}
.tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:20px;background:#eee;color:#555;font-weight:800;}
.item.promo .tag{background:var(--red);color:#fff;}
.acct-row{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
.acct-row .name{flex:1;font-weight:700;font-size:13px;}
.acct-row label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);}
input[type=checkbox]{accent-color:var(--red);}
input[type=date]{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px;}
.gate{max-width:320px;margin:60px auto;text-align:center;}
.gate-icon{font-size:34px;}
input.gate-input{width:100%;padding:14px 16px;margin-top:14px;border:2px solid var(--ink);border-radius:12px;
  font-size:18px;letter-spacing:.12em;font-family:Consolas,monospace;text-align:center;background:#101010;color:var(--red);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-head{font-size:10px;text-align:center;color:var(--sub);text-transform:uppercase;}
.cal-cell{border:1px solid var(--line);border-radius:8px;min-height:70px;padding:4px;background:var(--paper);}
.cal-cell .d{font-size:10.5px;font-weight:700;color:var(--sub);}
.cal-cell textarea{width:100%;border:0;background:transparent;resize:none;font-size:10.5px;height:44px;font-family:inherit;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
footer{flex-shrink:0;text-align:center;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--sub);}
footer a{color:var(--red);font-weight:800;text-decoration:none;}
.growth-table{width:100%;border-collapse:collapse;}
.growth-table th,.growth-table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12.5px;}
.growth-table th{color:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
.growth-table input[type=number]{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;}
.delta.up{color:#1a8a3a;font-weight:800;}
.delta.down{color:var(--red);font-weight:800;}
.seg{display:inline-flex;background:#161616;border-radius:9px;padding:4px;gap:4px;}
.seg button{background:none;border:0;color:#bbb;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
.seg button.active{background:var(--red);color:#fff;}
.table-wrap{overflow-x:auto;}
@media (max-width:480px){
  header{padding:10px 12px;gap:8px;}
  .brand{font-size:16px;}
  nav button{padding:7px 10px;font-size:11px;}
  input.admin-pin{width:82px;font-size:11.5px;padding:7px 8px;}
  button.pill{padding:7px 10px;font-size:11px;}
  main{padding:14px 10px 40px;}
  .card{padding:14px;border-radius:13px;}
  .grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
  .item{flex-wrap:wrap;}
  .item .title{flex:1 1 100%;order:1;}
  .item input[type=text]{flex:1 1 100%;order:3;}
  .item .tag{order:2;}
  .acct-row{flex-direction:column;align-items:flex-start;gap:8px;}
  .acct-row label{font-size:11.5px;}
  .cal-grid{gap:3px;}
  .cal-cell{min-height:54px;padding:3px;}
  .cal-cell textarea{height:32px;font-size:9px;}
  .cal-cell .d{font-size:9.5px;}
  .growth-table th,.growth-table td{padding:6px 4px;font-size:11.5px;}
  .growth-table input[type=number]{width:64px;}
}

.timer-big{font-family:Consolas,monospace;font-size:44px;font-weight:800;letter-spacing:.04em;line-height:1;}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bbb;margin-right:6px;}
.status-dot.on{background:#1a8a3a;box-shadow:0 0 0 4px rgba(26,138,58,.18);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
button.big{border:0;border-radius:11px;padding:12px 22px;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:var(--red);}
button.big.out{background:var(--ink);}
button.big:disabled{opacity:.3;cursor:not-allowed;}
.plat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.plat-head h2{margin:0;}
.acct-block{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.acct-block .name{font-weight:800;font-size:13.5px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;}
.acct-block .name small{color:var(--sub);font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);cursor:pointer;}
.chips label.car{border-color:var(--ink);}
.chips label.done{background:rgba(26,138,58,.09);border-color:#1a8a3a;}
.chips input{width:17px;height:17px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--sub);font-weight:700;}
.badge.ok{background:rgba(26,138,58,.1);border-color:#1a8a3a;color:#1a8a3a;}
.badge.car{border-style:dashed;}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:12px;}
.bar i{display:block;height:100%;background:var(--red);}
.log{font-size:12.5px;color:var(--sub);margin:4px 0 0;}
@media (max-width:480px){.timer-big{font-size:34px;}}

.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.hero-top .who{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
.hero-num{font-size:58px;font-weight:800;line-height:1;margin-top:16px;letter-spacing:-.02em;}
.hero-num small{font-size:24px;color:var(--sub);font-weight:700;margin-left:4px;}
.hero-sub{font-size:12px;color:var(--sub);margin-top:4px;text-transform:uppercase;letter-spacing:.05em;}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:16px;color:var(--sub);}
.hero-meta b{color:var(--ink);font-family:Consolas,monospace;}
.hero-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);}
.hero-foot b{color:var(--ink);}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:800;margin:18px 0 4px;}
.grp:first-child{margin-top:0;}
.arow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.arow:last-child{border-bottom:0;}
.arow .ah{flex:1;font-weight:700;font-size:14px;}
.arow .an{font-size:12px;color:var(--sub);width:34px;text-align:right;font-weight:700;}
.pips{display:flex;align-items:center;gap:6px;}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid #cfcdbf;display:inline-block;}
.pip.sq{border-radius:4px;}
.pip.on{background:var(--ink);border-color:var(--ink);}
.pip.miss{border-color:var(--red);}
.sep{width:1px;height:14px;background:var(--line);margin:0 4px;display:inline-block;}
.legend{font-size:11px;color:var(--sub);margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.legend .pip{width:10px;height:10px;border-width:1.5px;margin-right:4px;vertical-align:middle;}
.sheet-scroll{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;}
table.sheet{width:100%;border-collapse:collapse;font-size:12.5px;}
table.sheet th{position:sticky;top:0;background:var(--ink);color:#fff;text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;z-index:1;}
table.sheet td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.sheet tbody tr[data-d]{cursor:pointer;}
table.sheet tr.sel td{background:rgba(255,67,40,.1);font-weight:700;}
table.sheet tr.dim td{color:#aaa;}
table.sheet td.bad{color:var(--red);font-weight:800;}
table.sheet tfoot td{font-weight:800;background:var(--paper);position:sticky;bottom:0;}
table.sheet tr.grp-start td{border-top:2px solid var(--ink);}
.st{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;background:#eee;color:#666;text-transform:uppercase;}
.st.Posted{background:rgba(26,138,58,.12);color:#1a8a3a;}
.st.Missed{background:rgba(255,67,40,.12);color:var(--red);}
input.vin{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;}
small.due{display:block;font-size:10px;color:var(--sub);margin-top:2px;}
small.due.now{color:#c77700;font-weight:800;}
.sheet-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.cal-cell{cursor:pointer;overflow:hidden;}
.cal-cell.sel{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,67,40,.25);}
.cal-cell.today .d{color:var(--red);}
.cal-cell .d{display:flex;justify-content:space-between;}
.cal-cell .cb{font-size:8.5px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 5px;}
.cal-txt{font-size:10.5px;white-space:pre-wrap;word-break:break-word;max-height:44px;overflow:hidden;margin-top:3px;}
textarea.cal-ed{width:100%;min-height:130px;padding:12px;border:1.5px solid var(--ink);border-radius:12px;font-family:inherit;font-size:14px;resize:vertical;}
@media (max-width:480px){.hero-num{font-size:46px;}.pip{width:12px;height:12px;}.pips{gap:5px;}}

.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-left:8px;vertical-align:middle}
.sync.live{background:#1a8a3a}.sync.offline{background:var(--red)}
.ringwrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:14px}
.ringbox{position:relative;width:150px;height:150px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}.rt{stroke:var(--line)}.rf{stroke:var(--red);stroke-linecap:round}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt .hero-num{font-size:34px;margin:0}.ringtxt .hero-num small{font-size:15px}.ringtxt .hero-sub{font-size:9px;margin:2px 0 0}
.streak b{display:block;font-size:46px;line-height:1;color:var(--red)}
.streak span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:800}
.streak em{display:block;font-size:12px;color:var(--sub);font-style:normal;margin-top:4px}
.hm{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.hb .hl{flex:0 0 130px}
.hb .hbar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hb .hbar i{display:block;height:100%;background:var(--ink)}.hb .hbar i.best{background:var(--red)}.hb b{width:46px;text-align:right}
.stsel,.duein{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:var(--paper);color:var(--ink)}
.duein.late{border-color:var(--red);color:var(--red)}
@media (max-width:480px){.stsel,.duein{order:4;flex:1 1 40%}}
#reportOv{position:fixed;inset:0;z-index:50;background:#fff;color:#000;overflow:auto;padding:24px 16px;--ink:#000;--paper:#f6f5ef;--line:#e2e0d4;--sub:#6b6b6b}
#reportOv .card{background:#fff}.rep{max-width:760px;margin:0 auto}
@media print{.no-print{display:none!important}body>*:not(#reportOv){display:none!important}#reportOv{position:static;overflow:visible;padding:0}}
:root[data-theme=dark]{--ink:#f2f0e8;--paper:#0d0d0d;--line:#2a2a2a;--sub:#9a9a96}
:root[data-theme=dark] header{background:#000}
:root[data-theme=dark] .card{background:#171717}
:root[data-theme=dark] .item.promo{background:#222}
:root[data-theme=dark] table.sheet th,:root[data-theme=dark] button.big.out{background:#2a2a2a;color:#fff}
:root[data-theme=dark] .cal-cell .cb{background:#444}
:root[data-theme=dark] input[type=text],:root[data-theme=dark] input[type=date],:root[data-theme=dark] input[type=number],:root[data-theme=dark] textarea{background:#101010;color:var(--ink);border-color:var(--line)}
:root[data-theme=dark] button.ghost{color:var(--ink)!important;border-color:#444!important}

main.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}main.enter>*:nth-child(2){animation-delay:.06s}main.enter>*:nth-child(3){animation-delay:.12s}main.enter>*:nth-child(n+4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
body{letter-spacing:-.005em;font-variant-numeric:tabular-nums}
header{backdrop-filter:blur(12px);box-shadow:0 6px 24px -12px rgba(0,0,0,.5)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px -16px rgba(0,0,0,.14);transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 18px 38px -18px rgba(0,0,0,.28);border-color:rgba(255,67,40,.35)}
.stat,.fs{transition:transform .22s,border-color .22s,box-shadow .22s}
.stat:hover,.fs:hover{transform:translateY(-3px);border-color:var(--red);box-shadow:0 12px 24px -14px rgba(255,67,40,.6)}
nav button{transition:background .2s,color .2s}nav button:hover:not(.active){background:#262626;color:#fff}
button.pill,button.big,button.ghost{transition:transform .15s,box-shadow .2s,filter .2s}
button.pill:hover,button.big:hover{transform:translateY(-1px);box-shadow:0 10px 20px -10px var(--red);filter:brightness(1.07)}button.ghost:hover{transform:translateY(-1px)}
.item,.arow,table.sheet tbody tr,.chips label{transition:background .2s,transform .2s,border-color .2s}
.item:hover{transform:translateX(4px)}.arow:hover{background:rgba(255,67,40,.05)}table.sheet tbody tr:hover td{background:rgba(255,67,40,.05)}.chips label:hover{border-color:var(--red)}
.cal-cell{transition:transform .15s,box-shadow .15s}.cal-cell:hover{transform:scale(1.05);z-index:2;box-shadow:0 8px 18px -8px rgba(0,0,0,.35)}
.pip{transition:transform .15s}.pip:hover{transform:scale(1.4)}.hb .hbar i{transition:width .8s cubic-bezier(.2,.7,.2,1)}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fs{position:relative;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.fs span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:800}
.fs b{display:block;font-size:30px;margin:6px 0 2px;letter-spacing:-.02em}.fs b small{font-size:14px;color:var(--sub);font-weight:700}.fs .bar{height:6px;margin-top:8px}
.fs:not(:last-child)::after{content:'\203A';position:absolute;right:-11px;top:50%;transform:translateY(-50%);color:var(--red);font-weight:800;font-size:20px;z-index:1}
.cols{display:flex;align-items:flex-end;gap:4px;height:110px}.cols div{flex:1;background:var(--red);border-radius:4px 4px 0 0;min-height:2px;opacity:.8;transition:opacity .2s,transform .2s}.cols div:hover{opacity:1;transform:scaleY(1.04);transform-origin:bottom}
small.due.late{color:var(--red);font-weight:800}
@media (max-width:600px){.funnel{grid-template-columns:repeat(2,1fr)}.fs::after{display:none}}
@media print{.card{box-shadow:none;transform:none!important;animation:none}}

.vo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--red);border-radius:12px;margin-bottom:14px;font-size:12.5px}
.vo b{color:var(--red);text-transform:uppercase;letter-spacing:.06em}.vo span{flex:1;color:var(--sub)}.vo input{padding:7px 10px;border:1px solid var(--line);border-radius:8px}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.7}
footer{transition:opacity .2s}footer a{transition:opacity .2s}footer a:hover{opacity:.7;text-decoration:underline}

/* ===== v5: slim instagram-style header ===== */
:root{--pop:#fff}:root[data-theme=dark]{--pop:#171717}
body{padding-top:0}
header{position:sticky;top:0;z-index:30;display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:10px;
 height:calc(54px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));
 background:rgba(255,255,255,.84);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:none;-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
:root[data-theme=dark] header{background:rgba(10,10,10,.82)}

/* ===== v12: design system pass — calm, aligned, minimal ===== */
:root{--r:16px;--card:#fff;--soft:rgba(20,20,20,.045);--ok:#1a8a3a;--warn:#c77700;--sh:0 1px 2px rgba(16,16,16,.04),0 8px 24px -16px rgba(16,16,16,.18)}
:root[data-theme=dark]{--card:#141414;--soft:rgba(255,255,255,.05);--sh:0 1px 2px rgba(0,0,0,.5)}
body{font-family:'Inter',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.008em}
main{max-width:1080px;padding:26px 20px 72px}
/* cards */
.card,:root[data-theme=dark] .card{background:var(--card);background-image:none;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.card:hover{transform:none;box-shadow:var(--sh);border-color:var(--line)}
.card h1,.card h2{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:0 0 14px;gap:8px;line-height:1.3}
.card h1{color:var(--ink);font-size:12.5px}
.card h1::before,.card h2::before{width:3px;height:12px;border-radius:2px;background:var(--red)}
.sheet-bar h1::before,.cal-nav h1::before{display:none}
.sheet-bar,.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-bar h1,.cal-nav h1{flex:1;justify-content:center;text-align:center;margin:0!important;font-size:14px;letter-spacing:.02em;text-transform:none}
.banner{background:var(--card)!important;border-left:3px solid var(--red)}
.banner b{font-size:15px;font-weight:700}
/* stat tiles — label on top, number below, equal heights */
.grid{gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:0}
.stat{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:86px;padding:14px 16px;border-radius:12px;background:var(--soft);border:1px solid transparent}
.stat::after{display:none}
.stat:hover{transform:none;box-shadow:none;border-color:var(--line)}
.stat b{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.stat>b:first-child+span{order:-1}
.stat span{font-size:10.5px;letter-spacing:.06em;font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--soft)}
.bar i{border-radius:999px}
/* segmented controls */
.seg,#anSeg{display:flex;width:100%;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;color:var(--sub);border-radius:9px;padding:8px 10px;font-weight:600;font-size:12.5px;font-family:inherit}
.seg button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button:hover:not(.active){color:var(--ink)}
/* buttons */
button{font-family:inherit}
button.ghost{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:10px;padding:8px 14px;font-weight:600;font-size:12.5px}
button.ghost:hover{border-color:var(--ink)!important;transform:none}
button.pill{border-radius:10px;padding:9px 14px;font-weight:700;font-size:12.5px}
button.big{border-radius:12px;font-size:13.5px;padding:12px 20px}
button.pill:hover,button.big:hover{transform:none;box-shadow:none;filter:brightness(1.06)}
button.big.out,:root[data-theme=dark] button.big.out{background:var(--ink);color:var(--paper)}
/* inputs */
input[type=number],input[type=date],input[type=time],input.ttl,select.stsel,textarea.cal-ed,.xform input,.xform select{font-family:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;font-size:13px}
input.vin{height:34px;width:92px;padding:0 10px}
input[type=date],input[type=time]{height:34px;padding:0 8px}
select.stsel{height:34px;padding:0 8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)!important;box-shadow:0 0 0 3px rgba(127,127,127,.16)}
textarea.cal-ed{border-width:1px;padding:12px 14px;line-height:1.5}
/* tables */
table.sheet th,:root[data-theme=dark] table.sheet th{background:var(--card);color:var(--sub);font-weight:700;border-bottom:1px solid var(--line);padding:10px 12px}
table.sheet td{padding:10px 12px}
table.sheet tfoot td{background:var(--card)}
table.sheet tr.grp-start td{border-top:1px solid var(--line)}
table.sheet tr.sel td{background:rgba(255,67,40,.08)}
.sheet-scroll{border-radius:12px}
.growth-table th{padding:10px 8px}
/* calm motion: no jumping */
.item:hover,.feed:hover,.pip:hover,.ib:hover,.brand:hover,.brand:hover span{transform:none}
.cal-cell:hover{transform:none;box-shadow:none;border-color:var(--sub)}
.tile:hover,.gr:hover,.tp:hover,.acct-block:hover,.fs:hover{transform:none;box-shadow:none;border-color:var(--sub)}
.plat .arow:hover{padding-left:16px}
/* rows & lists */
.item{border-radius:12px;padding:10px 12px;gap:12px}
.item.edu{background:var(--soft)}
.arow{min-height:48px}
.feed{padding:10px 4px;border-bottom:1px solid var(--line);border-radius:0}
.feed:last-child{border-bottom:0}.feed:hover{background:none}
.feed .muted{white-space:nowrap}
.acct-block{border-radius:12px;padding:12px 14px}
.chips label{background:var(--card);border-radius:10px;min-height:36px}
.chips label.done{background:rgba(26,138,58,.08)}
.chips label.car{border-style:dashed;border-color:var(--sub)}.chips label.car.done{border-style:solid;border-color:var(--ok)}
.cal-grid{gap:6px}.cal-cell{min-height:82px;border-radius:10px;padding:6px;background:var(--card)}
.tile,.tp,.gr,.fs{background:var(--card)}
.tpg{gap:10px}.tp{padding:12px}
.hero-num{letter-spacing:-.035em}
.legend{gap:16px}
footer{padding-top:8px;font-size:12px}
/* header */
header{height:calc(60px + env(safe-area-inset-top,0px))}
.brand{font-size:21px}
nav#tabs button{height:38px;font-weight:600;font-size:13px}
nav#tabs button:hover .ic{transform:none}
.ib:hover{background:var(--soft)}
/* page head */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 2px 20px}
.pagehead .pt{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:0;color:var(--ink);text-transform:none}
.pagehead p{margin:5px 0 0;color:var(--sub);font-size:13px}
.pagehead .phr{display:flex;gap:8px;align-items:center}
/* 2-column dashboard on desktop */
@media (min-width:900px){
 main.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
 main.cols2>*{margin-bottom:0!important;min-width:0}
 main.cols2>.pagehead,main.cols2>.nbar,main.cols2>.banner,main.cols2>.wide{grid-column:1/-1}
}
/* notifications: bell, menu, prompt bar, toasts */
.nb{position:relative}
.nbadge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-style:normal;font-weight:800;display:grid;place-items:center;border:2px solid var(--card)}
.nbadge[hidden]{display:none}
.nmenu{width:340px;max-height:70vh;overflow:auto;padding:0}
.nmenu .nh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--pop)}
.nmenu .nh b{font-size:14px}
.ni{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.ni:last-child{border-bottom:0}.ni:hover{background:var(--soft)}
.ni i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:var(--sub)}
.ni i.warn{background:var(--warn)}.ni i.bad{background:var(--red)}.ni i.msg{background:#4f5bd5}.ni i.ok{background:var(--ok)}
.ni b{display:block;font-size:13px;margin-bottom:2px}.ni span{display:block;font-size:12px;color:var(--sub);line-height:1.4}
.nbar{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:16px;box-shadow:var(--sh)}
.nbar .nbi{flex:0 0 36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft)}
.nbar .nbi svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nbar .nbt{flex:1;font-size:12.5px;color:var(--sub)}.nbar .nbt b{display:block;color:var(--ink);font-size:13.5px}
.nbar .nbx{border:0;background:none;color:var(--sub);font-size:20px;cursor:pointer}
#toasts{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{width:300px;max-width:calc(100vw - 32px);padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--paper);box-shadow:0 16px 40px -16px rgba(0,0,0,.5);opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .3s;pointer-events:auto}
.toast.on{opacity:1;transform:none}.toast b{display:block;font-size:13px}.toast span{display:block;font-size:12px;opacity:.75;margin-top:2px}
.msgcard .feed .fx{white-space:pre-wrap}
.gx h2::before{display:none}
span.chip{display:inline-flex;align-items:center;gap:5px}span.chip .lg{width:16px;height:16px}
/* extra posts + posting time */
.xform{display:grid;grid-template-columns:1.5fr .9fr .9fr .8fr 1.4fr auto;gap:8px;align-items:center}
.xform>*{height:38px;min-width:0;width:100%;padding:0 10px}
.xform button{width:auto;padding:0 16px}
.xl{margin-top:12px}
.xr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.xr .xm{flex:1;min-width:0;font-size:13px}.xr .xm b{font-weight:700}.xr .xm small{display:block;color:var(--sub);font-size:11.5px}
.xdel{border:0;background:none;color:var(--sub);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:8px}.xdel:hover{color:var(--red);background:var(--soft)}
input.ptime{height:26px;padding:0 4px;font-size:11.5px;border-radius:7px;width:auto;margin-left:2px}

@media (max-width:700px){.xform{grid-template-columns:1fr 1fr}.xform #xAcct,.xform #xAdd{grid-column:1/-1}.xform #xAdd{width:100%}}
/* mobile: app-style bottom tab bar */

/* ===== v13: dashboard redesign ===== */
.dz{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.dz .card{margin:0}
.dz>.s8>.card,.dz>.s6>.card{height:100%}.dz{align-items:stretch}.dz>.s4.stack,.dz>.s4{align-self:start}
.tm .stt{display:inline-flex}
.dz .s12{grid-column:span 12}.dz .s8{grid-column:span 8}.dz .s6{grid-column:span 6}.dz .s4{grid-column:span 4}
.dz .stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.dz .s8,.dz .s6,.dz .s4{grid-column:span 12}}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch h2{margin:0!important}
.ch .muted{font-size:12px}
/* hero */
.hero2{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:center;position:relative;overflow:hidden}
.hero2::after{content:'';position:absolute;right:-120px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,67,40,.10),transparent 65%);pointer-events:none}

.sg.on{stroke:var(--red)}
.sg.late{stroke:var(--red);opacity:.35;stroke-dasharray:3 3}
.hr-glow{fill:var(--soft);transform-origin:100px 100px;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
.orb{transform-origin:100px 100px;animation:orb 18s linear infinite}
.orb circle{fill:var(--red)}
@keyframes orb{to{transform:rotate(360deg)}}
.hr-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hr-c b{font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1}
.hr-c b small{font-size:22px;color:var(--sub);font-weight:600;letter-spacing:-.02em;margin-left:2px}
.hr-c>span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin-top:6px}
.hr-side{min-width:0;position:relative;z-index:1}
.hr-msg{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:0 0 4px}
.hr-sub{color:var(--sub);font-size:13px;margin:0 0 18px}
.plrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-bottom:18px}
.plc{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.plc .lg{width:24px;height:24px}
.plc div{flex:1;min-width:0}.plc b{display:block;font-size:15px;line-height:1.1}.plc span{font-size:11px;color:var(--sub)}
.plc .bar{height:4px;margin-top:6px}
.nx-h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin-bottom:6px}
.nx{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.nx .lg{width:20px;height:20px}.nx b{font-weight:600;flex:1}.nx em{font-style:normal;font-size:11px;color:var(--sub)}
.nx-done{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ok);padding:10px 0}
.nx-done i{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
@media (max-width:700px){.hero2{grid-template-columns:1fr;justify-items:center;gap:18px}.hr-side{width:100%}.hring{width:200px;height:200px}.hr-c b{font-size:48px}.hr-msg{text-align:center;font-size:18px}.hr-sub{text-align:center}}
/* stat cards */
.kn{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.kn small{font-size:15px;color:var(--sub);font-weight:600;letter-spacing:0;margin-left:4px}
.ks{font-size:12px;color:var(--sub);margin-top:6px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:16px}
.strip i{aspect-ratio:1;border-radius:4px;background:var(--soft)}
.strip i.full{background:var(--red)}.strip i.part{background:rgba(255,67,40,.38)}.strip i.miss{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}.strip i.today{outline:2px solid var(--ink);outline-offset:1px}
.strip-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:6px}
.mrow{display:flex;gap:18px;margin-top:4px}
.mrow div b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em}.mrow div span{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.mrow .bad{color:var(--red)}
/* work card */
.stt{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--sub);padding:5px 10px;border-radius:999px;background:var(--soft)}
.stt i{width:8px;height:8px;border-radius:50%;background:#bbb}
.stt.on{color:var(--ok);background:rgba(26,138,58,.1)}.stt.on i{background:var(--ok);animation:pulse2 1.8s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(26,138,58,.55)}100%{box-shadow:0 0 0 9px rgba(26,138,58,0)}}
.wk-t{font-family:Consolas,ui-monospace,monospace;font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.shp{margin-top:16px}.shp .bar{height:6px;margin:0;position:relative;overflow:visible}
.shp .bar i{position:relative}.shp .bar i::after{content:'';position:absolute;right:-5px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--red)}
.shp-l{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:8px}
.dz-work .btn-row{margin-top:16px}.dz-work .btn-row .big{flex:1}
/* timeline */
.tl{position:relative;height:150px;margin:4px 6px 0}
.tl-track{position:absolute;left:0;right:0;bottom:30px;height:6px;border-radius:3px;background:var(--soft)}
.tl-shift{position:absolute;bottom:30px;height:6px;border-radius:3px;background:rgba(255,67,40,.25)}

// ---------- work-session helpers (timer) ----------
const pad = n => String(n).padStart(2,'0');
function fmtDur(ms){ const t=Math.max(0,Math.floor(ms/1000)); return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function getDay(date){ const d = data.poster[date] = data.poster[date] || {}; d.tasks = d.tasks || {}; d.sessions = d.sessions || []; d.times = d.times || {}; d.views = d.views || {}; return d; }
function setPosted(day,key,val,date){ day.tasks[key]=val; if(val){ if(date===todayKey()) day.times[key]=day.times[key]||Date.now(); } else delete day.times[key]; }
const dnr=h=>String(h).replace(/^@/,'').replace(/_+/g,' ').trim().toUpperCase(), dn=h=>esc(dnr(h));
const esc = v => String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const dateKey = (y,m,d) => y+'-'+pad(m+1)+'-'+pad(d);
function dayOrEmpty(date){ return data.poster[date] ? getDay(date) : {tasks:{},sessions:[],times:{},views:{}}; }
function firstTracked(){ const ks=Object.keys(data.poster).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).filter(k=>{const d=data.poster[k]; return (d.sessions&&d.sessions.length)||Object.values(d.tasks||{}).some(Boolean);}).sort(); return ks[0]||null; }
function statusOf(date,key,ft){ const d=dayOrEmpty(date); if(d.tasks[key]) return 'Posted'; if(date<todayKey()) return (ft&&date>=ft)?'Missed':'—'; return 'Pending'; }
function dayStats(date,ft){ const d=dayOrEmpty(date); const total=ALL_TASKS.length; const posted=doneCount(d); const tracked=!!ft&&date>=ft&&date<=todayKey();
  const missed=(date<todayKey()&&tracked)?total-posted:0; let v24=0,v48=0; Object.values(d.views||{}).forEach(v=>{v24+=Number(v.h24)||0; v48+=Number(v.h48)||0;});
  return {posted,missed,total,v24,v48,tracked}; }
function monthTotals(y,m){ const ft=firstTracked(); const n=new Date(y,m+1,0).getDate(); const t={posted:0,missed:0,v24:0,v48:0}; for(let i=1;i<=n;i++){ const x=dayStats(dateKey(y,m,i),ft); t.posted+=x.posted; t.missed+=x.missed; t.v24+=x.v24; t.v48+=x.v48; } return t; }
function workedMs(day){ return (day.sessions||[]).reduce((a,x)=>a+((x.out||Date.now())-x.in),0); }
function isOn(day){ return (day.sessions||[]).some(x=>!x.out); }
function doneCount(day){ return ALL_TASKS.filter(t=>day.tasks && day.tasks[t.key]).length; }
let tickHandle=null;
function startTick(){
  clearInterval(tickHandle);
  const update=()=>{ const els=document.querySelectorAll('[data-timer]'); if(!els.length){ clearInterval(tickHandle); return; }
    els.forEach(el=>{ const day=data.poster[el.dataset.timer]; if(day) el.textContent=fmtDur(workedMs(day)); }); };
  update(); tickHandle=setInterval(update,1000);
}
function sessionLog(day){
  if(!(day.sessions||[]).length) return '<p class="log">No sign-ins yet.</p>';
  return '<p class="log">'+day.sessions.map(x=>`In ${fmtTime(x.in)} → ${x.out?('Out '+fmtTime(x.out)):'<b style="color:#1a8a3a">working now</b>'}`).join(' &nbsp;•&nbsp; ')+'</p>';
}

    return `<tr><td>${lbl}${k===tk?' <span class="tag">Today</span>':''}</td><td>${sess}</td><td><b data-timer="${k}">${fmtDur(workedMs(d))}</b></td></tr>`; }).join('');

function sumRows(y,m){
  const ft=firstTracked(); const n=new Date(y,m+1,0).getDate();
  let html='';
  for(let i=1;i<=n;i++){
    const key=dateKey(y,m,i), x=dayStats(key,ft);
    const wd=new Date(y,m,i).toLocaleDateString([], {weekday:'short'});
    html += `<tr data-d="${key}" class="${key===sheetDate?'sel':''} ${x.tracked?'':'dim'}"><td>${wd} ${i}</td><td>${x.tracked?x.posted+'/'+x.total:'—'}</td><td class="${x.missed?'bad':''}">${x.tracked?x.missed:'—'}</td><td>${x.v24||'—'}</td><td>${x.v48||'—'}</td></tr>`;
  }
  return html;
}
function viewCell(key,f,val,base){
  const has = val!=='' && val!=null;
  let hint='';
  if(!has && base){ const due=base+(f==='h24'?24:48)*3600000;
    hint = Date.now()>=due ? '<small class="due now">due now</small>' : '<small class="due">due '+new Date(due).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'})+'</small>'; }
  return `<input type="number" min="0" class="vin" data-key="${key}" data-f="${f}" placeholder="0" value="${has?val:''}">${hint}`;
}
function downloadCsv(y,m){
  const ft=firstTracked(); const n=new Date(y,m+1,0).getDate();
  const rows=[['Date','Platform','Account','Post','Status','Views 24h','Views 48h']];
  for(let i=1;i<=n;i++){ const key=dateKey(y,m,i); if(!dayStats(key,ft).tracked) continue; const day=dayOrEmpty(key);
    ACCOUNTS.forEach(a=>a.tasks.forEach(t=>{ const v=day.views[t.key]||{};
      rows.push([key,a.platform,a.handle,t.label,statusOf(key,t.key,ft),v.h24==null?'':v.h24,v.h48==null?'':v.h48]); })); }
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='zahra-'+y+'-'+pad(m+1)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

function addDays(k,n){ const d=new Date(k+'T00:00:00'); d.setDate(d.getDate()+n); return dateKey(d.getFullYear(),d.getMonth(),d.getDate()); }
function streak(){
  const ft=firstTracked(), tot=ALL_TASKS.length; if(!ft) return {cur:0,best:0};
  const full=d=>doneCount(dayOrEmpty(d))>=tot; let best=0,run=0;
  for(let d=ft; d<=todayKey(); d=addDays(d,1)){ if(full(d)){ run++; best=Math.max(best,run); } else run=0; }
  let cur=0, d=todayKey(); if(!full(d)) d=addDays(d,-1); while(d>=ft&&full(d)){ cur++; d=addDays(d,-1); }
  return {cur,best};
}

  s.innerHTML='<defs><linearGradient id="iggG" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".4" stop-color="#fa7e1e"/><stop offset=".7" stop-color="#d62976"/><stop offset="1" stop-color="#962fbf"/></linearGradient></defs>';
  document.body.prepend(s); LOGO.ig=LOGO.ig.replace(/<defs>.*?<\/defs>/,'').replace('url(#igg)','url(#iggG)'); })();


// ===== v18: 3-day month-end window, monthly report for the manager, no goals =====
const fmtDay=d=>d.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'});
viewsCycle=function(){ const t=new Date(), y=t.getFullYear(), m=t.getMonth(), d=t.getDate(), last=new Date(y,m+1,0).getDate();
  if(d===last) return {ym:ymOf(y,m),open:true,day:1,due:new Date(y,m+1,2),opens:new Date(y,m,last)};
  const p=new Date(y,m-1,1), pym=ymOf(p.getFullYear(),p.getMonth()), due=new Date(y,m,2);
  if(d<=2) return {ym:pym,open:true,day:d+1,due,opens:new Date(y,m,last)};
  return {ym:pym,open:false,overdue:true,due,opens:new Date(y,m,last),cur:ymOf(y,m)}; };
const mvCnt=ym=>{ const R=monthPosts(ym); return {n:R.length,miss:R.filter(r=>!hasV(r.v)).length}; };

// Sheet → Views: open on the month that needs attention
const _vp18=viewsPane;
viewsPane=function(){ if(!mvYm){ const c=viewsCycle(); mvYm=c.open||mvCnt(c.ym).miss?c.ym:todayKey().slice(0,7); }
  let h=_vp18(); const c=viewsCycle();
  if(mvYm===c.ym&&(c.open||c.overdue)){ const {n,miss}=mvCnt(mvYm);
    const st=c.open?`<div class="mvwin"><b>Day ${c.day} of 3</b><span>Due by ${fmtDay(c.due)}</span></div>`:miss?`<div class="mvwin late"><b>Overdue</b><span>Was due ${fmtDay(c.due)} · ${miss} left</span></div>`:'';
    h=h.replace('<div class="mvp">',st+'<div class="mvp">'); }
  return h.replace('You\'ll get a reminder that day.',`Zahra has 3 days: the last day of the month and the next 2 days.`); };

// alerts: window + overdue + report ready
const _af18=alertsFor;
alertsFor=function(){ const A=_af18().filter(a=>!/^mvm?-/.test(a.id)); if(!me) return A; const c=viewsCycle(), {n,miss}=mvCnt(c.ym), mn=monName(c.ym).split(' ')[0];
  if(me.role==='poster'&&n&&miss){ if(c.open) A.unshift({id:'mv-'+todayKey(),lv:'warn',title:`Add ${mn} views · day ${c.day} of 3`,body:`${miss} of ${n} posts left. Due by ${fmtDay(c.due)}.`,tab:'sheet',pane:'views'});
    else A.unshift({id:'mv-'+todayKey(),lv:'bad',title:`${mn} views are overdue`,body:`${miss} of ${n} posts still need views.`,tab:'sheet',pane:'views'}); }
  if(adminMode&&n){ if(c.overdue&&miss) A.unshift({id:'mvm-'+todayKey(),lv:'bad',title:`${POSTER_NAME} missed the ${mn} views deadline`,body:`${miss} of ${n} posts still need views.`,tab:'analytics'});
    if(!miss&&new Date().getDate()<=7&&c.ym<todayKey().slice(0,7)) A.unshift({id:'mr-'+c.ym,lv:'ok',title:`${mn} report is ready`,body:'Zahra has added views for every post.',tab:'analytics'}); }
  return A; };

// month-end popup with the new window
mvPopup=function(){ if(!me||me.role!=='poster'||document.getElementById('mvOv')) return; const c=viewsCycle(), tk=todayKey(); if(ls12.get('dot_mvpop','')===tk) return;
  const {n,miss}=mvCnt(c.ym); if(!n||!miss||!(c.open||c.overdue)) return; ls12.set('dot_mvpop',tk); const mn=monName(c.ym).split(' ')[0];
  const title=c.open?(c.day===1?`Last day of ${mn}`:`${mn} views · day ${c.day} of 3`):`${mn} views are overdue`;
  const body=c.open?`Add views for <b>${miss}</b> ${mn} post${miss>1?'s':''}${n-miss?` (${n-miss} already done)`:''}. Due by ${fmtDay(c.due)}.`:`<b>${miss}</b> of ${n} posts still need views. The deadline was ${fmtDay(c.due)}.`;
  const o=document.createElement('div'); o.id='mvOv'; o.className='lg-ov';
  o.innerHTML=`<div class="lg-card mvpop" role="dialog" aria-modal="true"><div class="mvl-i">${mkSvg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>')}</div><div class="lg-logo">${title}</div><p class="lg-sub">${body}</p>${c.open?`<div class="mvdots">${[1,2,3].map(i=>`<i class="${i<c.day?'past':i===c.day?'on':''}"></i>`).join('')}</div>`:''}<button class="login-btn lg-go" id="mvGo">Add views now</button><button class="lg-guest" id="mvLater">Later</button></div>`;
  document.body.appendChild(o); requestAnimationFrame(()=>o.classList.add('on')); const close=()=>{ o.classList.remove('on'); setTimeout(()=>o.remove(),260); };
  o.querySelector('#mvGo').onclick=()=>{ close(); mvYm=c.ym; shPane='views'; activeTab='sheet'; render(); window.scrollTo({top:0}); }; o.querySelector('#mvLater').onclick=close; o.onclick=e=>{ if(e.target===o) close(); }; };

// CSV: month-end numbers instead of 24h/48h
downloadCsv=function(y,m){ const ym=ymOf(y,m), ft=firstTracked(), n=new Date(y,m+1,0).getDate(), rows=[['Date','Platform','Account','Post','Status','Posted at','Views','FB views','Likes','Comments','Shares','Saves','Followers gained']];
  for(let i=1;i<=n;i++){ const key=dateKey(y,m,i); if(!dayStats(key,ft).tracked) continue; const day=dayOrEmpty(key), V=k=>day.views[k]||{}, at=k=>day.times[k]?fmtTime(day.times[k]):'';
    const vals=v=>[v.h48!=null&&v.h48!==''?v.h48:(v.h24??''),v.fbv??'',v.likes??'',v.comments??'',v.shares??'',v.saves??'',v.fol??''];
    ACCOUNTS.forEach(a=>a.tasks.forEach(t=>rows.push([key,a.platform,a.handle,t.label,statusOf(key,t.key,ft),at(t.key),...vals(V(t.key))])));
    (day.extra||[]).forEach(x=>{ const a=ACCOUNTS.find(z=>z.id===x.acct); if(a) rows.push([key,a.platform,a.handle,xLabel(x),'Posted (extra)',at(x.id),...vals(V(x.id))]); }); }
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'), a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='dot-'+ym+'.csv'; document.body.appendChild(a); a.click(); a.remove(); };

// ---------- Analytics: Monthly report + Team ----------
function monthStats(ym){ const R=monthPosts(ym), y=+ym.slice(0,4), m=+ym.slice(5,7)-1, t=monthTotals(y,m), num=(v,f)=>Number(f==='h48'?(v.h48!==''&&v.h48!=null?v.h48:v.h24):v[f])||0;
  const S={ym,posts:R.length,filled:R.filter(r=>hasV(r.v)).length,views:0,fb:0,likes:0,comments:0,shares:0,saves:0,fol:0,posted:t.posted,missed:t.missed,R};
  R.forEach(r=>{ r.n=num(r.v,'h48'); r.fb=num(r.v,'fbv'); r.eng=['likes','comments','shares','saves'].reduce((x,f)=>x+num(r.v,f),0); r.fol=num(r.v,'fol'); S.views+=r.n; S.fb+=r.fb; ['likes','comments','shares','saves','fol'].forEach(f=>S[f]+=num(r.v,f)); });
  S.complete=S.posts>0&&S.filled===S.posts; S.eng=S.likes+S.comments+S.shares+S.saves; S.avg=S.posts?Math.round(S.views/S.posts):0; S.rate=t.posted+t.missed?Math.round(t.posted/(t.posted+t.missed)*100):0; return S; }
const prevYm=ym=>{ const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-2,1); return ymOf(d.getFullYear(),d.getMonth()); };
function reportMonths(){ const ft=firstTracked(), cur=todayKey().slice(0,7), L=[]; if(!ft) return [cur]; for(let d=new Date(+ft.slice(0,4),+ft.slice(5,7)-1,1); ymOf(d.getFullYear(),d.getMonth())<=cur; d.setMonth(d.getMonth()+1)) L.push(ymOf(d.getFullYear(),d.getMonth())); return L.reverse(); }
let anYm=null, anPane2='report';
const delta=(a,b)=>b?`<em class="dl ${a>=b?'up':'down'}">${a>=b?'+':''}${Math.round((a-b)/b*100)}%</em>`:'';
function reportBody(S,forPrint){ const P=monthStats(prevYm(S.ym)), pc=P.complete, st=(l,v,p)=>`<div class="stat"><span>${l}</span><b>${v}</b>${p||''}</div>`;
  const plat=[['ig','Instagram',r=>r.a.pid==='ig',r=>r.n],['fb','Facebook',r=>r.a.pid==='ig',r=>r.fb],['tt','TikTok',r=>r.a.pid==='tt',r=>r.n],['yt','YouTube',r=>r.a.pid==='yt',r=>r.n]]
    .map(([id,nm,f,g])=>({id,nm,v:S.R.filter(f).reduce((x,r)=>x+g(r),0),c:S.R.filter(f).length})).filter(p=>p.c&&(p.id!=='fb'||p.v)), pm=Math.max(1,...plat.map(p=>p.v));
  const acc=ACCOUNTS.map(a=>{ const L=S.R.filter(r=>r.a.id===a.id); return {a,n:L.length,v:L.reduce((x,r)=>x+r.n,0),e:L.reduce((x,r)=>x+r.eng,0),f:L.reduce((x,r)=>x+r.fol,0)}; }).filter(o=>o.n).sort((x,y)=>y.v-x.v);
  const kind=k=>{ const L=S.R.filter(r=>/carousel/i.test(r.l)===(k==='carousel')); return L.length?Math.round(L.reduce((x,r)=>x+r.n,0)/L.length):0; };
  const top=[...S.R].sort((x,y)=>y.n-x.n), row=(r,i)=>`<div class="ef" style="--i:${i}"><time>${fmtD(r.k)}</time><span class="erow">${logo(r.a.pid)}<b>${dn(r.a.handle)} · ${esc(r.l)}</b><em>${fmtN(r.n)}</em></span></div>`;
  return `<div class="card">${ek(monName(S.ym)+' · report',forPrint?'':`<span class="ok">✓ complete</span>`)}
    <div class="grid kpi3" style="margin-top:14px">${st('Views',fmtN(S.views),pc?delta(S.views,P.views):'')}${st('Avg per post',fmtN(S.avg),pc?delta(S.avg,P.avg):'')}${st('Engagement',fmtN(S.eng),pc?delta(S.eng,P.eng):'')}${st('Followers gained','+'+fmtN(S.fol),pc?delta(S.fol,P.fol):'')}${st('Posts',S.posts)}${st('Posting rate',S.rate+'%')}</div>
    ${pc?`<p class="muted" style="margin:14px 0 0;font-size:12px">Compared with ${monName(P.ym)}.</p>`:''}</div>
   <div class="card">${ek('Views by platform')}${plat.map(p=>`<div class="hb"><span class="hl">${logo(p.id)} ${p.nm}</span><div class="hbar"><i style="width:${p.v/pm*100}%"></i></div><b>${fmtN(p.v)}</b></div>`).join('')}</div>
   <div class="card">${ek('By account')}<div class="table-wrap"><table class="growth-table"><thead><tr><th>Account</th><th>Posts</th><th>Views</th><th>Avg</th><th>Engagement</th><th>Followers</th></tr></thead><tbody>${acc.map(o=>`<tr><td>${logo(o.a.pid)} ${dn(o.a.handle)}</td><td data-l="Posts">${o.n}</td><td data-l="Views">${fmtN(o.v)}</td><td data-l="Avg">${fmtN(Math.round(o.v/o.n))}</td><td data-l="Engagement">${fmtN(o.e)}</td><td data-l="Followers">+${fmtN(o.f)}</td></tr>`).join('')}</tbody></table></div></div>
   <div class="card">${ek('Reels vs carousels','avg views per post')}<div class="grid" style="margin-top:14px">${st('Reels',fmtN(kind('reel')))}${st('Carousels',fmtN(kind('carousel')))}</div></div>
   <div class="card">${ek('Top posts')}${top.slice(0,5).map(row).join('')}${top.length>5?`<div class="ek" style="margin-top:20px"><span>Lowest</span></div>${top.slice(-3).reverse().map(row).join('')}`:''}</div>`; }
function reportWait(S){ const c=viewsCycle(), cur=todayKey().slice(0,7), isCur=S.ym===cur&&!c.open, inWin=S.ym===c.ym&&c.open, over=S.ym===c.ym&&c.overdue;
  const msg=isCur?`The report opens after ${POSTER_NAME} adds views. Her window is ${fmtDay(c.opens)} to ${fmtDay(new Date(c.opens.getFullYear(),c.opens.getMonth()+1,2))}.`:inWin?`${POSTER_NAME} is adding views now · day ${c.day} of 3 · due ${fmtDay(c.due)}.`:over?`The deadline was ${fmtDay(c.due)}. ${S.posts-S.filled} posts still need views.`:`${S.posts-S.filled} posts still need views before this report can be shown.`;
  return `<div class="card mrwait">${ek(monName(S.ym)+' · report',over?'<span class="bad">overdue</span>':isCur?'collecting':'waiting')}
    <div class="enum sm">${roll(S.filled)}<span class="of">/ ${S.posts} posts with views</span></div><div style="margin:14px 0">${ln(S.posts?S.filled/S.posts:0)}</div><p class="muted" style="margin:0">${msg}</p></div>
   <div class="card">${ek('Posting so far')}<div class="grid" style="margin-top:14px"><div class="stat"><span>Posted</span><b>${S.posted}</b></div><div class="stat"><span>Missed</span><b class="${S.missed?'bad':''}">${S.missed}</b></div><div class="stat"><span>Posting rate</span><b>${S.rate}%</b></div><div class="stat"><span>Posts incl. extras</span><b>${S.posts}</b></div></div></div>`; }
function openMonthReport(ym){ const S=monthStats(ym), old=document.getElementById('reportOv'); if(old) old.remove(); const o=document.createElement('div'); o.id='reportOv';
  o.innerHTML=`<div class="rep"><div class="no-print" style="display:flex;gap:8px;margin-bottom:18px"><button class="pill" id="repPrint">Print / Save as PDF</button><button class="ghost" id="repClose">Close</button></div><div class="pagehead"><div><h1 class="pt">${esc(CLIENT_NAME)} · ${monName(ym)}</h1><p>Monthly content report · prepared by Team Editora</p></div></div>${reportBody(S,true)}</div>`;
  document.body.appendChild(o); o.querySelector('#repPrint').onclick=()=>window.print(); o.querySelector('#repClose').onclick=()=>o.remove(); }
function teamPane(){ let posted=0,missed=0,hrs=0; const ft=firstTracked(); for(let i=0;i<anDays;i++){ const k=addDays(todayKey(),-i), x=dayStats(k,ft); posted+=x.posted; missed+=x.missed; }
  const tm=teamStats();
  return `<div class="card">${ek('Team performance')}<div class="seg" id="anSeg" style="margin:10px 0 18px">${[7,30,90].map(n=>`<button data-n="${n}" class="${anDays===n?'active':''}">Last ${n} days</button>`).join('')}</div>
    <div class="grid"><div class="stat"><span>Posted</span><b>${posted}</b></div><div class="stat"><span>Missed</span><b class="${missed?'bad':''}">${missed}</b></div><div class="stat"><span>Posting rate</span><b>${posted+missed?Math.round(posted/(posted+missed)*100):0}%</b></div></div></div>
   <div class="card">${ek('Progress')}${teamBars(tm,posted,missed)}</div>
   <div class="card">${ek('Editors')}<div class="table-wrap"><table class="growth-table"><thead><tr><th>Editor</th><th>Provided</th><th>Delivered</th><th>Avg turnaround</th><th>On time (24h)</th></tr></thead><tbody>${tm.map(t=>`<tr><td>${t.ed.name}</td><td data-l="Provided">${t.prov}/${t.exp}</td><td data-l="Delivered">${t.del}</td><td data-l="Turnaround">${t.avg}</td><td data-l="On time">${t.ot}</td></tr>`).join('')}</tbody></table></div></div>`; }
renderAnalytics=function(){ if(!adminMode) return lockedCard('Analytics'); const months=reportMonths();
  if(!anYm||!months.includes(anYm)){ const done=months.find(ym=>ym<todayKey().slice(0,7)&&monthStats(ym).complete); anYm=done||viewsCycle().ym; if(!months.includes(anYm)) anYm=months[0]; }
  const S=monthStats(anYm), sel=`<select class="stsel" id="anMon">${months.map(ym=>{ const s=monthStats(ym); return `<option value="${ym}" ${ym===anYm?'selected':''}>${monName(ym)}${s.complete?' · ready':s.posts?' · '+s.filled+'/'+s.posts:''}</option>`; }).join('')}</select>`;
  const bar=`<div class="anbar"><div class="seg" id="anP">${[['report','Monthly report'],['team','Team']].map(([k,l])=>`<button data-p="${k}" class="${anPane2===k?'active':''}">${l}</button>`).join('')}</div>${anPane2==='report'?sel+(S.complete?'<button class="ghost" id="anPrint">Print / PDF</button>':''):''}</div>`;
  document.getElementById('app').innerHTML=bar+(anPane2==='team'?teamPane():S.complete?reportBody(S):reportWait(S)); };
document.addEventListener('click',e=>{ let b;
  if(b=e.target.closest('#anP button')){ anPane2=b.dataset.p; render(); return; }
  if(b=e.target.closest('#anSeg button')){ anDays=+b.dataset.n; render(); return; }
  if(e.target.closest('#anPrint')){ openMonthReport(anYm); return; }
  if(e.target.closest('#phRep')){ e.stopPropagation(); activeTab='analytics'; anPane2='report'; render(); window.scrollTo({top:0}); } },true);
document.addEventListener('change',e=>{ if(e.target.id==='anMon'){ anYm=e.target.value; render(); } });

load(); cloudInit(); applyTheme();
loadSession();
render();
</script>
